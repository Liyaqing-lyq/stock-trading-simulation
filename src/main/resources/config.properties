# 模拟参数
simulation.speed=1.0
simulation.duration=300
# 每个 agent 两次决策之间的真实间隔（秒），除以 speed 生效
simulation.tick.interval.ms=1000

# 标的（symbol=初始参考价，仅用于生成 agent 的参考价与初始行情）
stocks=AAPL,GOOGL,TSLA
AAPL=175.50
GOOGL=141.80
TSLA=245.30

# 人类 broker
agent.human.count=2
agent.human.initial.balance=100000.00
agent.human.initial.holdings=AAPL=100,GOOGL=50

# AI 交易员
agent.ai.count=3
agent.ai.initial.balance=50000.00
agent.ai.decision.interval=3
agent.ai.initial.holdings=AAPL=200,GOOGL=100,TSLA=50

# 噪音/做市 agent（用于在没有人类下单时也让价格动起来）
# 注意：它们必须拿到初始持仓，否则市场上没有任何可卖股票，第一笔成交永远无法产生
agent.noise.count=2
agent.noise.initial.balance=80000.00
agent.noise.initial.holdings=AAPL=800,GOOGL=400,TSLA=300

# LLM
llm.endpoint=https://api.deepseek.com/v1/chat/completions
llm.model=deepseek-chat
llm.rate.limit.ms=1000
llm.timeout.ms=15000
llm.price.band.percent=5.0
llm.api.key=${LLM_API_KEY}

# 输出
io.data.dir=data
