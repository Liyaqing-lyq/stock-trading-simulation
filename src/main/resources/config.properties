# 模拟参数
simulation.speed=1.0
simulation.duration=300
# 每个 agent 两次决策之间的真实间隔（秒），除以 speed 生效
simulation.tick.interval.ms=1000

# A 股模拟标的（symbol=昨收价；limit.percent=日涨跌幅；tick.size=最小价格变动）
stocks=V001,G001,T001,S001
V001=100.00
V001.limit.percent=10
V001.tick.size=0.01
G001=50.00
G001.limit.percent=20
G001.tick.size=0.01
T001=80.00
T001.limit.percent=20
T001.tick.size=0.01
S001=10.00
S001.limit.percent=10
S001.tick.size=0.01

# 人类 broker
agent.human.count=2
agent.human.initial.balance=100000.00
agent.human.initial.holdings=V001=100,G001=100,T001=100,S001=500

# AI 交易员
agent.ai.count=3
agent.ai.initial.balance=50000.00
agent.ai.decision.interval=3
agent.ai.initial.holdings=V001=200,G001=200,T001=200,S001=1000

# 噪音/做市 agent（用于在没有人类下单时也让价格动起来）
# 注意：它们必须拿到初始持仓，否则市场上没有任何可卖股票，第一笔成交永远无法产生
agent.noise.count=2
agent.noise.initial.balance=80000.00
agent.noise.initial.holdings=V001=800,G001=800,T001=800,S001=3000

# LLM
llm.endpoint=https://api.deepseek.com/v1/chat/completions
llm.model=deepseek-chat
llm.rate.limit.ms=1000
llm.timeout.ms=15000
llm.price.band.percent=5.0
llm.api.key=${LLM_API_KEY}

# 输出
io.data.dir=data
